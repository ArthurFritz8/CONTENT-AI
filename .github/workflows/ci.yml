# Trava 2 automatizada (Regra D): testes das Edge Functions a cada push.
name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-web-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@content-ai/web-panel
      - run: npm run build --workspace=@content-ai/web-panel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser --workspace=@content-ai/web-panel

  test-edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testes unitários (_shared)
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
          deno test --allow-env --config supabase/functions/deno.json supabase/functions/_shared/

  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/setup-ffmpeg.sh
      - run: node scripts/scan-secrets.mjs
      - run: bash -n deploy.sh scripts/setup-piper.sh
      - name: Typecheck + testes (@content-ai/core)
        run: |
          npm run typecheck
          npm test
          node scripts/test-render.mjs

  test-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL temporário nativo
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createdb content_ai_audit
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f "$migration"
          done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/seed.sql -f supabase/verify-migrations.sql -f supabase/tests/audit.sql -f supabase/tests/review.sql -f supabase/tests/youtube.sql -f supabase/tests/youtube-shorts.sql -f supabase/tests/telegram-queue.sql -f supabase/tests/web-panel.sql -f supabase/tests/growth.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/concurrency-setup.sql
          pids=()
          for i in $(seq 1 12); do
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/concurrency-call.sql > /tmp/content-ai-concurrency-$i.log &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/concurrency-verify.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/review-concurrency-setup.sql
          pids=()
          for i in $(seq 1 12); do
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/review-concurrency-call.sql > /tmp/content-ai-review-$i.log &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/review-concurrency-verify.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/youtube-concurrency-setup.sql
          pids=()
          for i in $(seq 1 12); do
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/youtube-concurrency-call.sql > /tmp/content-ai-youtube-$i.log &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/youtube-concurrency-verify.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/telegram-queue-concurrency-setup.sql
          pids=()
          for i in $(seq 1 12); do
            sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/telegram-queue-concurrency-call.sql > /tmp/content-ai-queue-$i.log &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d content_ai_audit -f supabase/tests/telegram-queue-concurrency-verify.sql

  test-piper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install piper-tts==1.3.0
      - run: bash scripts/setup-ffmpeg.sh
      - run: bash scripts/setup-piper.sh
      - name: Síntese offline real
        run: |
          echo 'Teste de voz em português.' | python -m piper --model models/pt_BR-faber-medium.onnx --output_file /tmp/audit.wav
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/audit.wav
