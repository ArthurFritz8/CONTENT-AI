# Trava 2 automatizada (Regra D): testes das Edge Functions a cada push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testes unitários (_shared)
        run: deno test supabase/functions/_shared/
