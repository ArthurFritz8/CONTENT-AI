name: Studio animated dialogue preparation
on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: Capítulo com rascunho animado salvo
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: story-prepare-${{ inputs.episode_id }}
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.CONTENT_AI_ANIMATION_PREPARATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EPISODE_ID: ${{ inputs.episode_id }}
      CONTENT_AI_ANIMATION_PREPARATION_ENABLED: ${{ vars.CONTENT_AI_ANIMATION_PREPARATION_ENABLED }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts==7.2.8 Pillow==11.3.0
      - run: bash scripts/setup-ffmpeg.sh
      - run: env -u LD_LIBRARY_PATH deno run --config supabase/functions/deno.json --allow-env --allow-net --allow-read --allow-write --allow-run=python,ffmpeg,ffprobe scripts/run-story-preparation.ts
