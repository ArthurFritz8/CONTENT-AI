name: Studio animated shot
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: ID da tomada já reservada no Studio
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: studio-video-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  submit-or-recover:
    if: vars.CONTENT_AI_VIDEO_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTENT_AI_VIDEO_DISPATCH_ENABLED: ${{ vars.CONTENT_AI_VIDEO_DISPATCH_ENABLED }}
      VIDEO_JOB_ID: ${{ inputs.job_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install modal==1.6.1 Pillow==11.3.0
      - run: bash scripts/setup-ffmpeg.sh
      - name: Submeter ou recuperar a mesma tomada
        run: python scripts/run-story-video-worker.py --job "$VIDEO_JOB_ID"
