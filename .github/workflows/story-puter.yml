name: Puter native dialogue chapter worker
on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:
    inputs:
      episode_id:
        description: Capítulo preparado pelo Studio; vazio somente para conciliar pendências existentes
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: story-puter-native
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NATIVE_EPISODE_ID: ${{ inputs.episode_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: bash scripts/setup-ffmpeg.sh
      - uses: actions/cache@v4
        if: inputs.episode_id != ''
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-base
          key: native-speech-base-ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66
      - name: Preparar conferência local de áudio, sem GPU ou créditos de vídeo
        if: inputs.episode_id != ''
        continue-on-error: true
        timeout-minutes: 4
        run: |
          pip install -r scripts/native-review-requirements.txt
          python scripts/setup_native_review.py
      - name: Retomar as mesmas tomadas e montar para revisão, sem publicar
        run: node --experimental-strip-types scripts/run-puter-story-chapter.mts
