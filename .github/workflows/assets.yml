name: Assets TTS fallback
on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: UUID do episódio em script
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: assets-${{ inputs.episode_id }}
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EPISODE_ID: ${{ inputs.episode_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PIPER_MODEL_PATH: models/pt_BR-faber-medium.onnx
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts==7.2.8 piper-tts==1.3.0
      - run: ffmpeg -version
      - run: bash scripts/setup-piper.sh
      - name: Completar assets por checkpoint
        run: deno run --config supabase/functions/deno.json --allow-env --allow-net --allow-read --allow-write --allow-run=edge-tts,python,ffprobe scripts/run-assets.ts
